# npm trusted publishing pins this filename to ci.yml.
name: CI

on: [push, pull_request, workflow_dispatch]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # A new PR run can replace an old one; publishing must finish uninterrupted.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  npm_config_audit: false
  npm_config_fund: false

jobs:
  test:
    name: Full suite (Linux, Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # Checkout the source used for build and tests.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:smoke
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: target/main
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-smoke
          path: |
            target/main
            target/smoke
            target/smoke-managers
          retention-days: 3
          if-no-files-found: error

  smoke:
    name: Smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read # Checkout the manifests used by runtime smokes.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '18.12.0'
          - os: ubuntu-latest
            node: latest
          - os: windows-latest
            node: latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: runtime-smoke
          path: target
      - run: npm run test:smoke

  release:
    name: Release
    needs: [test, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write # Push the release commit/tag and create a GitHub release.
      packages: write # Publish the organization-scoped GitHub Packages alias.
      id-token: write # Authenticate npm publishing through OIDC.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: target/main
      # Publish the tested build; project dependencies are not installed here.
      - name: Release via zx-semrel (OIDC)
        env:
          NPM_OIDC: 'true'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: x-access-token
          GIT_BRANCH: master
          GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
          GIT_COMMITTER_NAME: ${{ vars.GIT_COMMITTER_NAME }}
          GIT_COMMITTER_EMAIL: ${{ vars.GIT_COMMITTER_EMAIL }}
          GIT_SIGN_KEY: ${{ secrets.GIT_SIGN_KEY }}
        run: npm run release

  post-release:
    name: Published package smoke (Node 18.12)
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '18.12.0'
          package-manager-cache: false
      - name: Check running via npx
        run: npx --yes yarn-berry-audit-fix@latest --help
      - name: Check global install
        # Read from the registry to verify the published artifact.
        run: npm install --global yarn-berry-audit-fix@latest # zizmor: ignore[adhoc-packages]
      - name: Check installed CLI
        run: yarn-berry-audit-fix --help
