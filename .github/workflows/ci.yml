name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  npm_config_audit: false
  npm_config_fund: false

jobs:
  test:
    name: Full suite (Linux, Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:smoke
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-smoke
          path: |
            target/main
            target/smoke
            target/smoke-managers
          retention-days: 3
          if-no-files-found: error

  smoke:
    name: Smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '18.12.0'
          - os: ubuntu-latest
            node: latest
          - os: windows-latest
            node: latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: runtime-smoke
          path: target
      - run: npm run test:smoke
