name: Zizmor

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '35 11 * * 4'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Analyze workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Checkout and fetch repository metadata for online audits.
      security-events: write # Upload SARIF findings to code scanning.
      actions: read # Read workflow metadata for the SARIF upload.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install zizmor
        run: pipx install zizmor==1.30.0
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor --config .github/zizmor.yml --persona auditor --format sarif . > zizmor.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: zizmor.sarif
          category: zizmor
